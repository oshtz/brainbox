name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example v1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate tag and aligned versions
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must be vMAJOR.MINOR.PATCH, got $env:RELEASE_TAG"
          }

          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $cargoVersion = [regex]::Match((Get-Content src-tauri/Cargo.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          foreach ($entry in @{ package = $packageVersion; cargo = $cargoVersion; tauri = $tauriVersion }.GetEnumerator()) {
            if ($entry.Value -ne $packageVersion) {
              throw "$($entry.Key) version $($entry.Value) does not match package version $packageVersion"
            }
          }
          if ($env:RELEASE_TAG -ne "v$packageVersion") {
            throw "Tag $env:RELEASE_TAG does not match package version v$packageVersion"
          }
          git describe --tags --exact-match | Out-Null
          $existingRelease = gh release list --limit 100 --json tagName | ConvertFrom-Json | Where-Object { $_.tagName -eq $env:RELEASE_TAG }
          if ($existingRelease) {
            throw "Release $env:RELEASE_TAG already exists; published releases are immutable"
          }
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install chromium

      - name: Validate frontend and browser behavior
        run: |
          pnpm run build
          pnpm run test:run
          pnpm run test:e2e

      - name: Validate Rust
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Validate native desktop behavior
        run: |
          pnpm run test:tauri:qa
          pnpm run smoke:tauri

      - name: Audit JavaScript dependencies
        run: pnpm audit

      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit --file src-tauri/Cargo.lock

  package-windows:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 45
    environment: release
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download and verify Enigma Virtual Box
        shell: pwsh
        env:
          EVB_INSTALLER_URL: ${{ vars.EVB_INSTALLER_URL }}
          EVB_INSTALLER_SHA256: ${{ vars.EVB_INSTALLER_SHA256 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:EVB_INSTALLER_URL) -or [string]::IsNullOrWhiteSpace($env:EVB_INSTALLER_SHA256)) {
            throw 'EVB_INSTALLER_URL and EVB_INSTALLER_SHA256 repository variables are required'
          }

          $installer = Join-Path $env:RUNNER_TEMP 'enigmavb-setup.exe'
          Invoke-WebRequest -Uri $env:EVB_INSTALLER_URL -OutFile $installer -UseBasicParsing -TimeoutSec 120
          $actualHash = (Get-FileHash $installer -Algorithm SHA256).Hash
          $expectedHashes = @($env:EVB_INSTALLER_SHA256 -split '[,\s]+' | Where-Object { $_ })
          if ($actualHash -notin $expectedHashes) {
            throw "EVB installer hash mismatch: got $actualHash"
          }

          $signature = Get-AuthenticodeSignature $installer
          $expectedSigner = '2603B1C2032C7C286F56FB80A638A2B1EC8E8AC9'
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $expectedSigner) {
            throw "EVB installer Authenticode validation failed: $($signature.Status)"
          }
          "EVB_INSTALLER=$installer" | Out-File $env:GITHUB_ENV -Append

      - name: Install Enigma Virtual Box
        shell: pwsh
        run: |
          $process = Start-Process -FilePath $env:EVB_INSTALLER -ArgumentList '/VERYSILENT','/NORESTART' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "EVB installer exited with code $($process.ExitCode)" }

          $console = @(
            "${env:ProgramFiles(x86)}\Enigma Virtual Box\enigmavbconsole.exe",
            "$env:ProgramFiles\Enigma Virtual Box\enigmavbconsole.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $console) { throw 'enigmavbconsole.exe was not installed' }
          "EVB_CONSOLE=$console" | Out-File $env:GITHUB_ENV -Append

      - name: Build Windows application
        run: pnpm tauri build --no-bundle --ci

      - name: Build and verify portable executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $inputExe = Resolve-Path 'src-tauri\target\release\brainbox.exe'
          $webviewDll = Get-ChildItem 'src-tauri\target' -Filter 'WebView2Loader.dll' -Recurse -File | Select-Object -First 1
          if (-not $webviewDll) { throw 'WebView2Loader.dll is missing from the Tauri build' }

          $staging = Join-Path $env:RUNNER_TEMP 'brainbox-evb-staging'
          New-Item -ItemType Directory -Force $staging | Out-Null
          Copy-Item $webviewDll.FullName $staging
          $project = Join-Path $env:RUNNER_TEMP 'brainbox.evb'
          $portable = Join-Path $PWD 'release-assets\brainbox-portable.exe'

          pnpm exec enigmavirtualbox generate $staging --input $inputExe --output $portable --project-name $project
          if ($LASTEXITCODE -ne 0) { throw 'Failed to generate the EVB project' }
          & $env:EVB_CONSOLE $project
          if ($LASTEXITCODE -ne 0) { throw 'EVB packaging failed' }
          if (-not (Test-Path $portable)) { throw 'brainbox-portable.exe was not created' }
          if ((Get-Item $portable).Length -lt 5MB) { throw 'brainbox-portable.exe is unexpectedly small' }

          $signature = Get-AuthenticodeSignature $portable
          Write-Host "Windows portable signature status: $($signature.Status) (unsigned is expected)"
          $hash = (Get-FileHash $portable -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  brainbox-portable.exe" | Set-Content release-assets\SHA256SUMS-windows.txt

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  package-macos:
    needs: validate
    runs-on: macos-14
    timeout-minutes: 60
    environment: release
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Import Apple signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$APPLE_CERTIFICATE" || { echo 'APPLE_CERTIFICATE is required' >&2; exit 1; }
          test -n "$APPLE_CERTIFICATE_PASSWORD" || { echo 'APPLE_CERTIFICATE_PASSWORD is required' >&2; exit 1; }
          KEYCHAIN_PATH="$RUNNER_TEMP/brainbox-build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/brainbox-signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/brainbox-signing.p12" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build signed and notarized DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for value in APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            test -n "${!value}" || { echo "$value is required" >&2; exit 1; }
          done
          pnpm tauri build --target aarch64-apple-darwin --bundles dmg --ci

          dmg_count=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')
          test "$dmg_count" -eq 1 || { echo "Expected one DMG, found $dmg_count" >&2; exit 1; }
          dmg=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg')
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"

      - name: Verify and stage macOS artifact
        run: |
          dmg_count=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')
          test "$dmg_count" -eq 1 || { echo "Expected one DMG, found $dmg_count" >&2; exit 1; }
          dmg=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg')
          codesign --verify --strict --verbose=2 "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"

          mount_dir=$(mktemp -d)
          cleanup() {
            hdiutil detach "$mount_dir" -quiet || true
            rm -rf "$mount_dir"
          }
          trap cleanup EXIT
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount_dir"
          app_count=$(find "$mount_dir" -maxdepth 1 -type d -name '*.app' | wc -l | tr -d ' ')
          test "$app_count" -eq 1 || { echo "Expected one app in DMG, found $app_count" >&2; exit 1; }
          app=$(find "$mount_dir" -maxdepth 1 -type d -name '*.app')
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          cleanup
          trap - EXIT

          mkdir release-assets
          cp "$dmg" release-assets/
          (cd release-assets && shasum -a 256 "$(basename "$dmg")" > SHA256SUMS-macos.txt)

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Delete temporary keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true

  publish:
    needs: [package-windows, package-macos]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify complete artifact set
        run: |
          mapfile -t portables < <(find release-assets -maxdepth 1 -type f -name 'brainbox-portable.exe')
          mapfile -t dmgs < <(find release-assets -maxdepth 1 -type f -name '*.dmg')
          test "${#portables[@]}" -eq 1 || { echo "Expected one portable EXE, found ${#portables[@]}" >&2; exit 1; }
          test "${#dmgs[@]}" -eq 1 || { echo "Expected one DMG, found ${#dmgs[@]}" >&2; exit 1; }
          test -f release-assets/SHA256SUMS-windows.txt
          test -f release-assets/SHA256SUMS-macos.txt
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 4
          (cd release-assets && sha256sum --check SHA256SUMS-windows.txt && sha256sum --check SHA256SUMS-macos.txt)

      - name: Create complete draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" release-assets/* --draft --verify-tag --generate-notes --title "brainbox $RELEASE_TAG"

      - name: Verify draft assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t expected < <(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t actual < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)
          test "${expected[*]}" = "${actual[*]}" || { echo 'Draft release asset set is incomplete' >&2; exit 1; }
          gh release edit "$RELEASE_TAG" --draft=false
